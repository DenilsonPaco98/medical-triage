services:
  # =====================================================================
  # API Server (FastAPI)
  # =====================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: medical-review-api
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - LOG_LEVEL=INFO
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - DEVICE=cpu
      - API_WORKERS=1
    volumes:
      - ./data:/app/data
      - ./mlruns:/app/mlruns
      - ./logs:/app/logs
    depends_on:
      mlflow:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - medical-review-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s


  # =====================================================================
  # MLflow Server (Experiment Tracking & Model Registry)
  # =====================================================================
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.0
    entrypoint: ["/bin/sh", "-c"]
    command:
      - pip install --no-cache-dir psycopg2-binary && exec mlflow server --backend-store-uri postgresql://mlflow:mlflow_password@postgres:5432/mlflow_db --default-artifact-root /mlflow/artifacts --host 0.0.0.0 --port 5000
    container_name: medical-review-mlflow
    ports:
      - "5000:5000"
    environment:
      - BACKEND_STORE_URI=postgresql://mlflow:mlflow_password@postgres:5432/mlflow_db
      - DEFAULT_ARTIFACT_ROOT=/mlflow/artifacts
      - MLFLOW_TRACKING_URI=postgresql://mlflow:mlflow_password@postgres:5432/mlflow_db
    volumes:
      - ./mlruns:/mlflow/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - medical-review-network
    restart: unless-stopped

  # =====================================================================
  # PostgreSQL (MLflow Backend & Data)
  # =====================================================================
  postgres:
    image: postgres:16-alpine
    container_name: medical-review-postgres
    environment:
      - POSTGRES_USER=mlflow
      - POSTGRES_PASSWORD=mlflow_password
      - POSTGRES_DB=mlflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - medical-review-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =====================================================================
  # Airflow (Orchestration)
  # =====================================================================
  airflow:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: medical-review-airflow
    environment:
      - AIRFLOW_HOME=/home/appuser/airflow
      - AIRFLOW__CORE__DAGS_FOLDER=/app/dags
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////home/appuser/airflow/airflow.db
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
    ports:
      - "4200:8080"
    volumes:
      - ./dags:/app/dags
      - ./data:/app/data
      - ./logs:/app/logs
      - airflow_home:/home/appuser/airflow
    networks:
      - medical-review-network
    restart: unless-stopped
    command: ["airflow", "standalone"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # =====================================================================
  # Prometheus (Metrics Collection)
  # =====================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: medical-review-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - medical-review-network
    restart: unless-stopped

  # =====================================================================
  # Grafana (Visualization & Dashboards)
  # =====================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: medical-review-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - medical-review-network
    restart: unless-stopped

networks:
  medical-review-network:
    driver: bridge

volumes:
  postgres_data:
  airflow_home:
  prometheus_data:
  grafana_data:
